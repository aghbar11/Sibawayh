[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibawayh"
version = "0.1.0"
description = "Arabic i'rab analysis and tutoring pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Installed per-phase, not up front. Each lands with the commit that needs it.
morphology = ["camel-tools>=1.5"]
# supar supplies the biaffine architecture the CATiB weights belong to. The
# published checkpoint was saved by an unreleased build, but we do not load the
# checkpoint — only converted tensors — so a normal release works. `transformers`
# arrives via camel-tools and supplies the CAMeLBERT encoder.
parser = ["supar>=1.1.4", "torch>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["sibawayh"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sibawayh", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not camel and not parser'"
markers = [
    "ldc: requires licensed PADT data under data/ldc/ (not in version control)",
    "camel: loads a live CAMeL model; deselected by default, run with `-m camel`",
    "parser: loads the converted CATiB model; deselected by default, run with `-m parser`",
]
