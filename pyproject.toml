[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibawayh"
version = "0.1.0"
description = "Arabic i'rab analysis and tutoring pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Installed per-phase, not up front. Each lands with the commit that needs it.
morphology = ["camel-tools>=1.5"]
parser = ["stanza>=1.8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["sibawayh"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sibawayh", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not camel'"
markers = [
    "ldc: requires licensed PADT data under data/ldc/ (not in version control)",
    "camel: loads a live CAMeL model; deselected by default, run with `-m camel`",
]
